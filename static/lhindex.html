<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Weather Forecast</title>
    </head>

    <body>
        <h3>🌦️ 5-Day Weather Forecast</h3>
        <div id="forecast-container"></div>

        <h2>Select Crop Type</h2>
        <select id="cropType">
            <!-- <option value="Maize">Maize</option>
            <option value="Wheat">Wheat</option>
            <option value="Rice">Rice</option>
            <option value="Barley">Barley</option> -->
        </select>
        <button onclick="setCropType()">Set Crop</button>

        <p id="responseMessage"></p>

        <script>
            async function fetchForecast() {
                try {
                    const response = await fetch("http://localhost:8000/forecast");
                    const data = await response.json();
                    console.log(data)
                    const forecastContainer = document.getElementById("forecast-container");
                    forecastContainer.innerHTML = "";  // Clear previous data
                    console.log(data.forecast)
                    data.forecast.forEach(entry => {
                        const forecastItem = document.createElement("p");
                        forecastItem.innerHTML = `<strong>${entry.DATE}:</strong> 🌡 ${entry.TEMP}°C, 💧 ${entry.RH}%, ☁️ ${entry.condition}`;
                        forecastContainer.appendChild(forecastItem);
                    });

                } catch (error) {
                    console.error("Error fetching forecast data:", error);
                }
            }

            fetchForecast();  // Fetch forecast on page load


            async function setCropType() {
                const cropType = document.getElementById("cropType").value;
                const responseMessage = document.getElementById("responseMessage");
                try {
                    console.log("Setting crop type:", cropType);
                    const response = await fetch("http://localhost:8000/set_croptype", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({ "crop_type": cropType })
                    });
                    const data = await response.json();
                    responseMessage.innerText = data.message || data.error;
                } catch (error) {
                    console.error("Error setting crop type:", error);
                    responseMessage.innerText = "Failed to set crop type.";
                }
            }



            async function fetchCropList() {
                try {
                    const response = await fetch("http://localhost:8000/get_crops"); // API from Flask

                    const data = await response.json();
                    console.log(data["crops"])

                    const cropTypeSelect = document.getElementById("cropType");
                    data.crops.forEach(crop => {
                        const option = document.createElement("option");
                        option.value = crop;
                        option.textContent = crop;
                        cropTypeSelect.appendChild(option);
                    });

                    // let moistureValues = data.sensor_readings.map(entry => entry.moisture);
                    //let maxMoisture = Math.max(...moistureValues);
                    //let minMoisture = Math.min(...moistureValues);
                    //console.log(data);
                    //document.getElementById("max-moisture").textContent = maxMoisture;
                    //document.getElementById("min-moisture").textContent = minMoisture;
                } catch (error) {
                    console.error("Error fetching crop list:", error);
                }
            }

            fetchCropList()

            const socket = new WebSocket("ws://localhost:8000/ws");
            console.log(socket)

            socket.onopen = function () {
                console.log("WebSocket Connected");
            };

            socket.onclose = function () {
                console.log("WebSocket Connected");
            };

            socket.onmessage = function (event) {
                let moisture = event.data;
                console.log("edrfo")
                console.log(moisture);
                //document.getElementById("moisture-display").innerText = "Moisture: " + moisture; -->
            };

            socket.onerror = function (error) {
                console.error("WebSocket Error:", error);
            };

        </script>
    </body>

</html>

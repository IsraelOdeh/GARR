        <h3>🌦️ 5-Day Weather Forecast</h3>

        <script>
            async function fetchForecast() {
                try {
                    const response = await fetch("https://up-cobra-hardy.ngrok-free.app/forecast");
                    const data = await response.json();
                    console.log(data)
                    const forecastContainer = document.getElementById("forecast-container");
                    forecastContainer.innerHTML = "";  // Clear previous data
                    console.log(data.forecast)
                    data.forecast.forEach(entry => {
                        const forecastItem = document.createElement("p");
                        forecastItem.innerHTML = `<strong>${entry.DATE}:</strong> 🌡 ${entry.TEMP}°C, 💧 ${entry.RH}%, ☁️ ${entry.condition}`;
                        forecastContainer.appendChild(forecastItem);
                    });

                } catch (error) {
                    console.error("Error fetching forecast data:", error);
                }
            }

            fetchForecast();  // Fetch forecast on page load


            async function setCropType() {
                const cropType = document.getElementById("cropType").value;
                const responseMessage = document.getElementById("responseMessage");
                try {
                    console.log("Setting crop type:", cropType);
                    const response = await fetch("https://up-cobra-hardy.ngrok-free.app/set_croptype", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({ "crop_type": cropType })
                    });
                    const data = await response.json();
                    responseMessage.innerText = data.message || data.error;
                } catch (error) {
                    console.error("Error setting crop type:", error);
                    responseMessage.innerText = "Failed to set crop type.";
                }
            }
